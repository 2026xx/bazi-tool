<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八字排盘工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft JhengHei", sans-serif; background: #f5f0e8; min-height: 100vh; padding: 30px 20px; }
.container { max-width: 680px; margin: 0 auto; }
h1 { text-align: center; font-size: 24px; color: #3d2b1f; margin-bottom: 6px; }
.subtitle { text-align: center; color: #8b6914; font-size: 14px; margin-bottom: 30px; }
.card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.card h2 { font-size: 16px; color: #3d2b1f; margin-bottom: 16px; border-bottom: 1px solid #e8dcc8; padding-bottom: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
label { font-size: 13px; color: #666; }
input, select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #333; background: #fafafa; width: 100%; }
input:focus, select:focus { outline: none; border-color: #8b6914; background: white; }
.hint { font-size: 11px; color: #999; margin-top: 3px; }
.btn { width: 100%; padding: 12px; background: #8b6914; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
.btn:hover { background: #6d5210; }
.result-card { background: #fffdf7; border: 1px solid #e8dcc8; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; }
.result-card h2 { font-size: 16px; color: #3d2b1f; margin-bottom: 12px; }
.section-title { font-size: 13px; font-weight: 500; color: #8b6914; margin: 14px 0 8px; }
table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 13px; }
th { background: #f5ede0; color: #3d2b1f; padding: 7px 8px; border: 1px solid #e0d0b8; text-align: center; font-size: 12px; }
td { text-align: center; padding: 7px 8px; border: 1px solid #e0d0b8; }
.gz { font-size: 20px; font-weight: bold; color: #3d2b1f; }
.gz-attr { font-size: 10px; color: #999; margin-top: 2px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.info-item { background: #f9f4ec; border-radius: 6px; padding: 8px 12px; }
.info-label { font-size: 11px; color: #999; }
.info-value { font-size: 13px; color: #333; font-weight: 500; }
.wuxing-bar { display: flex; gap: 6px; align-items: flex-end; height: 50px; margin-bottom: 4px; }
.wx-item { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
.wx-fill { width: 100%; border-radius: 3px 3px 0 0; }
.wx-label { font-size: 11px; color: #666; }
.wx-val { font-size: 11px; font-weight: 500; }
.dayun-table td { font-size: 12px; }
.now-row { background: rgba(139,105,20,0.1); font-weight: 500; }
.copy-btn { width: 100%; padding: 10px; background: #2d6a4f; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 12px; }
.copy-btn:hover { background: #1b4332; }
.tip { font-size: 12px; color: #999; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>八字排盘工具</h1>
  <div class="subtitle">自动真太阳时校正 · 精准四柱排盘 · 十神藏干五行大运</div>
  <div class="card">

</optgroup><optgroup label="B">
  <option value="白城">白城</option><option value="白山">白山</option><option value="白银">白银</option><option value="百色">百色</option><option value="保定">保定</option><option value="保山">保山</option><option value="宝鸡">宝鸡</option><option value="北京">北京</option><option value="北海">北海</option><option value="本溪">本溪</option><option value="毕节">毕节</option><option value="滨州">滨州</option><option value="亳州">亳州</option><option value="巴中">巴中</option><option value="巴彦淖尔">巴彦淖尔</option><option value="包头">包头</option>
</optgroup><optgroup label="C">
  <option value="沧州">沧州</option><option value="长春">长春</option><option value="长沙">长沙</option><option value="长治">长治</option><option value="常德">常德</option><option value="常州">常州</option><option value="承德">承德</option><option value="成都">成都</option><option value="赤峰">赤峰</option><option value="重庆">重庆</option><option value="崇左">崇左</option><option value="池州">池州</option><option value="楚雄">楚雄</option><option value="滁州">滁州</option><option value="昌都">昌都</option><option value="朝阳">朝阳</option>

  <option value="达州">达州</option><option value="大连">大连</option><option value="大庆">大庆</option><option value="大同">大同</option><option value="大理">大理</option><option value="丹东">丹东</option><option value="德宏">德宏</option><option value="德州">德州</option><option value="德阳">德阳</option><option value="迪庆">迪庆</option><option value="定西">定西</option><option value="东莞">东莞</option><option value="东营">东营</option>
</optgroup><optgroup label="E">
  <option value="鄂尔多斯">鄂尔多斯</option><option value="鄂州">鄂州</option><option value="恩施">恩施</option>
</optgroup><optgroup label="F">
  <option value="防城港">防城港</option><option value="佛山">佛山</option><option value="福州">福州</option><option value="抚顺">抚顺</option><option value="抚州">抚州</option><option value="阜新">阜新</option><option value="阜阳">阜阳</option>
</optgroup><optgroup label="G">
  <option value="赣州">赣州</option><option value="高雄">高雄</option><option value="固原">固原</option><option value="广安">广安</option><option value="广元">广元</option><option value="广州">广州</option><option value="贵港">贵港</option><option value="贵阳">贵阳</option><option value="桂林">桂林</option><option value="甘南">甘南</option><option value="甘孜">甘孜</option>
</optgroup><optgroup label="H">
  <option value="哈密">哈密</option><option value="哈尔滨">哈尔滨</option><option value="海口">海口</option><option value="海东">海东</option><option value="海西">海西</option><option value="邯郸">邯郸</option><option value="汉中">汉中</option><option value="杭州">杭州</option><option value="合肥">合肥</option><option value="河池">河池</option><option value="河源">河源</option><option value="贺州">贺州</option><option value="黑河">黑河</option><option value="衡水">衡水</option><option value="衡阳">衡阳</option><option value="红河">红河</option><option value="葫芦岛">葫芦岛</option><option value="呼和浩特">呼和浩特</option><option value="呼伦贝尔">呼伦贝尔</option><option value="湖州">湖州</option><option value="怀化">怀化</option><option value="黄冈">黄冈</option><option value="黄山">黄山</option><option value="黄石">黄石</option><option value="惠州">惠州</option><option value="和田">和田</option><option value="香港">香港</option>

  <option value="吉安">吉安</option><option value="吉林">吉林</option><option value="济南">济南</option><option value="济宁">济宁</option><option value="嘉兴">嘉兴</option><option value="嘉峪关">嘉峪关</option><option value="江门">江门</option><option value="焦作">焦作</option><option value="金昌">金昌</option><option value="金华">金华</option><option value="锦州">锦州</option><option value="晋城">晋城</option><option value="晋中">晋中</option><option value="荆门">荆门</option><option value="荆州">荆州</option><option value="景德镇">景德镇</option><option value="九江">九江</option><option value="酒泉">酒泉</option>

</optgroup><optgroup label="L">
  <option value="来宾">来宾</option><option value="兰州">兰州</option><option value="廊坊">廊坊</option><option value="乐山">乐山</option><option value="丽江">丽江</option><option value="丽水">丽水</option><option value="连云港">连云港</option><option value="凉山">凉山</option><option value="辽阳">辽阳</option><option value="辽源">辽源</option><option value="临沧">临沧</option><option value="临汾">临汾</option><option value="临沂">临沂</option><option value="临夏">临夏</option><option value="柳州">柳州</option><option value="六安">六安</option><option value="六盘水">六盘水</option><option value="龙岩">龙岩</option><option value="娄底">娄底</option><option value="泸州">泸州</option><option value="吕梁">吕梁</option><option value="林芝">林芝</option><option value="拉萨">拉萨</option>

</optgroup><optgroup label="N">
  <option value="南昌">南昌</option><option value="南充">南充</option><option value="南京">南京</option><option value="南宁">南宁</option><option value="南平">南平</option><option value="南通">南通</option><option value="南阳">南阳</option><option value="那曲">那曲</option><option value="宁波">宁波</option><option value="宁德">宁德</option>
</optgroup><optgroup label="P">
  <option value="盘锦">盘锦</option><option value="萍乡">萍乡</option><option value="普洱">普洱</option><option value="濮阳">濮阳</option><option value="平凉">平凉</option><option value="平顶山">平顶山</option>
</optgroup><optgroup label="Q">
  <option value="钦州">钦州</option><option value="秦皇岛">秦皇岛</option><option value="青岛">青岛</option><option value="庆阳">庆阳</option><option value="曲靖">曲靖</option><option value="衢州">衢州</option><option value="泉州">泉州</option>
</optgroup><optgroup label="R">
  <option value="日喀则">日喀则</option><option value="日照">日照</option>
</optgroup><optgroup label="S">
  <option value="三亚">三亚</option><option value="三明">三明</option><option value="三门峡">三门峡</option><option value="商洛">商洛</option><option value="商丘">商丘</option><option value="上海" selected>上海</option><option value="上饶">上饶</option><option value="绍兴">绍兴</option><option value="韶关">韶关</option><option value="深圳">深圳</option><option value="沈阳">沈阳</option><option value="石家庄">石家庄</option><option value="石嘴山">石嘴山</option><option value="朔州">朔州</option><option value="松原">松原</option><option value="遂宁">遂宁</option><option value="宿迁">宿迁</option><option value="宿州">宿州</option><option value="随州">随州</option><option value="绥化">绥化</option>

  <option value="烟台">烟台</option><option value="延安">延安</option><option value="延边">延边</option><option value="盐城">盐城</option><option value="扬州">扬州</option><option value="阳江">阳江</option><option value="阳泉">阳泉</option><option value="鹰潭">鹰潭</option><option value="营口">营口</option><option value="玉林">玉林</option><option value="玉溪">玉溪</option><option value="玉树">玉树</option><option value="运城">运城</option><option value="伊犁">伊犁</option><option value="宜春">宜春</option><option value="宜宾">宜宾</option><option value="宜昌">宜昌</option><option value="益阳">益阳</option><option value="岳阳">岳阳</option>

      </tr>
      <tr>
        <th>地支十神</th>

        <td id="r-mzss"></td>
        <td style="background:rgba(83,74,183,0.06)" id="r-dzss"></td>
        <td id="r-hzss"></td>
      </tr>
      <tr>
        <th>藏干</th>
        <td id="r-yhide"></td>
        <td id="r-mhide"></td>

    <button class="copy-btn" id="copy-btn" onclick="copyText()">复制八字信息给AI分析</button>
    <div class="tip">复制后切换到AI对话窗口，直接粘贴即可开始分析</div>
  </div>

async function calculate() {
  var name = document.getElementById('name').value || '用户';
  var gender = document.getElementById('gender').value;
  var year = document.getElementById('year').value;
  var month = document.getElementById('month').value;
  var day = document.getElementById('day').value;
  var hour = document.getElementById('hour').value;
  var minute = document.getElementById('minute').value;
  var city = document.getElementById('city-select').value;

  if (!year || !month || !day) {
    alert('请填写完整的出生年月日！');
    return;
  }

  var hourUnknown = (hour === '');
  var url = window.location.origin + '/calc?name=' + encodeURIComponent(name) +
    '&gender=' + encodeURIComponent(gender) +
    '&year=' + year + '&month=' + month + '&day=' + day +
    '&hour=' + (hourUnknown ? 12 : hour) + '&minute=' + (minute || 0) +
    '&city=' + encodeURIComponent(city) +
    '&hour_unknown=' + (hourUnknown ? '1' : '0');

  try {
    var res = await fetch(url);
    var d = await res.json();
    if (d.error) { alert('计算出错：' + d.error); return; }

    document.getElementById('r-name').textContent = d.name + ' / ' + d.gender;
    document.getElementById('r-solar').textContent = d.solar;
    document.getElementById('r-lunar').textContent = d.lunar_date;
    document.getElementById('r-realtime').textContent = d.real_time + ' ' + d.shichen + '（校正' + d.offset + '）';

    var hourUnknownFlag = hourUnknown;
    if (hourUnknownFlag) {
      document.getElementById('r-realtime').textContent = '时辰未知（仅供六字分析参考）';
    }

    document.getElementById('r-yg').textContent = d.year_gan;
    document.getElementById('r-mg').textContent = d.month_gan;
    document.getElementById('r-dg').textContent = d.day_gan;
    document.getElementById('r-yz').textContent = d.year_zhi;
    document.getElementById('r-mz').textContent = d.month_zhi;
    document.getElementById('r-dz').textContent = d.day_zhi;

    if (hourUnknown) {
      document.getElementById('r-hg').textContent = '？';
      document.getElementById('r-hz').textContent = '？';
      document.getElementById('r-hss').textContent = '未知';
      document.getElementById('r-hzss').textContent = '未知';
      document.getElementById('r-hhide').textContent = '未知';
    } else {
      document.getElementById('r-hg').textContent = d.hour_gan;
      document.getElementById('r-hz').textContent = d.hour_zhi;
      document.getElementById('r-hss').textContent = d.hour_gan_ss;
      document.getElementById('r-hzss').textContent = toArr(d.hour_zhi_ss);
      document.getElementById('r-hhide').innerHTML = d.hour_hide.join('<br>');
    }

    var gans = ['yg','mg','dg'];
    var ganVals = [d.year_gan, d.month_gan, d.day_gan];
    if (!hourUnknown) { gans.push('hg'); ganVals.push(d.hour_gan); }
    gans.forEach(function(id, i) {
      var info = GAN_INFO[ganVals[i]];
      if (info) {
        document.getElementById('r-'+id+'-attr').textContent = info.desc;
        document.getElementById('r-'+id+'-attr').style.color = info.color;
        document.getElementById('r-'+id).style.color = info.color;
      }
    });

    var zhis = ['yz','mz','dz'];
    var zhiVals = [d.year_zhi, d.month_zhi, d.day_zhi];
    if (!hourUnknown) { zhis.push('hz'); zhiVals.push(d.hour_zhi); }
    zhis.forEach(function(id, i) {
      var info = ZHI_INFO[zhiVals[i]];
      if (info) {
        document.getElementById('r-'+id+'-attr').textContent = info.desc;
        document.getElementById('r-'+id+'-attr').style.color = info.color;
        document.getElementById('r-'+id).style.color = info.color;
      }
    });

    document.getElementById('r-yss').textContent = d.year_gan_ss;
    document.getElementById('r-mss').textContent = d.month_gan_ss;
    document.getElementById('r-yzss').textContent = toArr(d.year_zhi_ss);
    document.getElementById('r-mzss').textContent = toArr(d.month_zhi_ss);
    document.getElementById('r-dzss').textContent = toArr(d.day_zhi_ss);
    document.getElementById('r-yhide').innerHTML = d.year_hide.join('<br>');
    document.getElementById('r-mhide').innerHTML = d.month_hide.join('<br>');
    document.getElementById('r-dhide').innerHTML = d.day_hide.join('<br>');

    var wx = d.wuxing;
    if (hourUnknown) {
      var wxMap = {'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水','子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};
      wx = {'木':0,'火':0,'土':0,'金':0,'水':0};
      for (var gz of [d.year_gan+d.year_zhi, d.month_gan+d.month_zhi, d.day_gan+d.day_zhi]) {
        for (var ch of gz) { if (wxMap[ch]) wx[wxMap[ch]]++; }
      }
    }
    var wxKeys = Object.keys(wx);
    var wxMax = Math.max.apply(null, Object.values(wx));
    var wxHtml = '<div class="wuxing-bar">';
    wxKeys.forEach(function(k) {
      var val = wx[k];
      var h = wxMax > 0 ? Math.round((val/wxMax)*40) + 10 : 10;
      wxHtml += '<div class="wx-item"><span class="wx-val" style="color:' + wxColor(k) + '">' + val + '</span><div class="wx-fill" style="height:' + h + 'px;background:' + wxColor(k) + '"></div><span class="wx-label">' + k + '</span></div>';
    });
    wxHtml += '</div>';
    if (hourUnknown) wxHtml += '<div style="font-size:11px;color:#999;margin-top:4px;">（时辰未知，仅统计六字）</div>';
    document.getElementById('wuxing-display').innerHTML = wxHtml;

    var dyTable = document.getElementById('dayun-table');
    while (dyTable.rows.length > 1) dyTable.deleteRow(1);
    var currentYear = new Date().getFullYear();
    d.da_yun.forEach(function(dy, i) {
      if (!dy.gz) return;
      var row = dyTable.insertRow();
      var isNow = dy.start_year <= currentYear && (dy.start_year + 10) > currentYear;
      if (isNow) row.className = 'now-row';
      row.innerHTML = '<td>' + (i+1) + (isNow ? ' ★' : '') + '</td><td>' + dy.start_age + '-' + dy.end_age + '岁</td><td style="font-weight:bold">' + dy.gz + '</td><td>' + dy.start_year + '年</td>';
    });

    window._lastResult = d;
    window._lastCity = city;
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').scrollIntoView({behavior: 'smooth'});

  } catch(e) {
    alert('服务器启动中（Render免费版需要30-60秒唤醒），请稍等后再按排盘按钮。');
  }
}

async function copyText() {
 var d = window._lastResult;
  if (!d) { alert('请先排盘！'); return; }
  var city = window._lastCity || '';

  var GAN_ATTR = {"甲":"阳木","乙":"阴木","丙":"阳火","丁":"阴火","戊":"阳土","己":"阴土","庚":"阳金","辛":"阴金","壬":"阳水","癸":"阴水"};
  var ZHI_ATTR = {"子":"阳水","丑":"阴土(湿土)","寅":"阳木","卯":"阴木","辰":"阳土(湿土)","巳":"阴火","午":"阳火","未":"阴土(燥土)","申":"阳金","酉":"阴金","戌":"阳土(燥土)","亥":"阴水"};

  function colDesc(gan, zhi) {
    return (GAN_ATTR[gan] || '') + '/' + (ZHI_ATTR[zhi] || '');
  }

  var wxStr = Object.entries(d.wuxing).map(function(e) { return e[0] + ':' + e[1]; }).join('、');

  var dyLines = d.da_yun.filter(function(dy) { return dy.gz; }).map(function(dy) {
    return '  ' + dy.gz + '（' + dy.start_age + '-' + dy.end_age + '岁，' + dy.start_year + '年起）';
  }).join('\n');

  var hourUnknownFlag = (document.getElementById('hour').value === '');

  // =============================================
  // 预计算刑冲合害区块
  // =============================================
  function calcRelations(zhiList) {
    var results = [];

    // 六冲
    var chong = [['子','午'],['丑','未'],['寅','申'],['卯','酉'],['辰','戌'],['巳','亥']];
    // 六合
    var he6 = [['子','丑'],['寅','亥'],['卯','戌'],['辰','酉'],['巳','申'],['午','未']];
    // 六害
    var hai = [['子','未'],['丑','午'],['寅','巳'],['卯','辰'],['申','亥'],['酉','戌']];
    // 三合
    var sanhe = [['申','子','辰'],['寅','午','戌'],['巳','酉','丑'],['亥','卯','未']];
    var sanhe_names = ['水局','火局','金局','木局'];
    // 半合
    var banhe = [['申','子'],['子','辰'],['寅','午'],['午','戌'],['巳','酉'],['酉','丑'],['亥','卯'],['卯','未']];
    var banhe_full = [['申','子','辰'],['申','子','辰'],['寅','午','戌'],['寅','午','戌'],['巳','酉','丑'],['巳','酉','丑'],['亥','卯','未'],['亥','卯','未']];
    var banhe_wx = ['水','水','火','火','金','金','木','木'];
    // 方合
    var fanghe = [['寅','卯','辰'],['巳','午','未'],['申','酉','戌'],['亥','子','丑']];
    var fanghe_names = ['木局','火局','金局','水局'];
    // 相刑（子卯）
    var xiangxing = [['子','卯']];
    // 三刑组（需三字同现）
    var sanxing = [['寅','巳','申'],['丑','戌','未']];
    var sanxing_names = ['无恩之刑','持势之刑'];
    // 自刑
    var zixing = ['辰','午','酉','亥'];

    var has = function(arr, z) { return arr.indexOf(z) !== -1; };

    // 六冲
    chong.forEach(function(pair) {
      var a = pair[0], b = pair[1];
      var ca = zhiList.filter(function(z){return z===a;}).length;
      var cb = zhiList.filter(function(z){return z===b;}).length;
      if (ca > 0 && cb > 0) {
        var positions = [];
        zhiList.forEach(function(z,i){ if(z===a||z===b) positions.push(posName(i, zhiList.length)); });
        results.push('【' + a + b + '冲】' + positions.join('与'));
      }
    });

    // 六合
    he6.forEach(function(pair) {
      var a = pair[0], b = pair[1];
      if (has(zhiList,a) && has(zhiList,b)) {
        results.push('【' + a + b + '六合】');
      }
    });

    // 六害
    hai.forEach(function(pair) {
      var a = pair[0], b = pair[1];
      if (has(zhiList,a) && has(zhiList,b)) {
        results.push('【' + a + b + '害】');
      }
    });

    // 三合
    sanhe.forEach(function(trio, i) {
      if (has(zhiList,trio[0]) && has(zhiList,trio[1]) && has(zhiList,trio[2])) {
        results.push('【' + trio.join('') + '三合' + sanhe_names[i] + '】');
      }
    });

    // 半合（仅两字出现且不构成三合时）
    banhe.forEach(function(pair, i) {
      var full = banhe_full[i];
      var missingChar = full.find(function(z){ return !has(zhiList,z); });
      if (!missingChar) return; // 三合已成立，跳过半合
      if (has(zhiList,pair[0]) && has(zhiList,pair[1])) {
        results.push('【' + pair.join('') + '半合' + banhe_wx[i] + '局（缺' + missingChar + '）】');
      }
    });

    // 方合
    fanghe.forEach(function(trio, i) {
      if (has(zhiList,trio[0]) && has(zhiList,trio[1]) && has(zhiList,trio[2])) {
        results.push('【' + trio.join('') + '方合' + fanghe_names[i] + '】');
      }
    });

    // 子卯相刑
    xiangxing.forEach(function(pair) {
      if (has(zhiList,pair[0]) && has(zhiList,pair[1])) {
        results.push('【' + pair[0] + pair[1] + '相刑（无礼之刑）】');
      }
    });

    // 三刑（须三字同现）
    sanxing.forEach(function(trio, i) {
      if (has(zhiList,trio[0]) && has(zhiList,trio[1]) && has(zhiList,trio[2])) {
        results.push('【' + trio.join('') + '三刑（' + sanxing_names[i] + '）】');
      } else {
        // 仅两字相遇→相刑
        var pairs = [[trio[0],trio[1]],[trio[1],trio[2]],[trio[0],trio[2]]];
        pairs.forEach(function(p) {
          if (has(zhiList,p[0]) && has(zhiList,p[1])) {
            results.push('【' + p[0] + p[1] + '相刑（' + trio.join('') + '三刑未全，仅两字）】');
          }
        });
      }
    });

    // 自刑
    zixing.forEach(function(z) {
      var cnt = zhiList.filter(function(x){return x===z;}).length;
      if (cnt >= 2) results.push('【' + z + z + '自刑】');
    });

    return results.length > 0 ? results.join('；') : '无';
  }

  function posName(idx, total) {
    // 原局四支：年支/月支/日支/时支
    // 扩展列表：前四为原局，第五为大运，第六为流年
    var names = ['年支','月支','日支','时支','大运地支','流年地支'];
    return names[idx] || ('支'+idx);
  }

  // 天干合克预计算
  function calcGanRelations(ganList) {
    var results = [];
    var he5 = [['甲','己'],['乙','庚'],['丙','辛'],['丁','壬'],['戊','癸']];
    var he5_wx = ['土','金','水','木','火'];
    var ke = [['甲','戊'],['甲','己'],['乙','戊'],['乙','己'],  // 木克土
              ['戊','壬'],['戊','癸'],['己','壬'],['己','癸'],  // 土克水
              ['壬','丙'],['壬','丁'],['癸','丙'],['癸','丁'],  // 水克火
              ['丙','庚'],['丙','辛'],['丁','庚'],['丁','辛'],  // 火克金
              ['庚','甲'],['庚','乙'],['辛','甲'],['辛','乙']]; // 金克木
    var ke_desc = ['木克土','木克土','木克土','木克土','土克水','土克水','土克水','土克水','水克火','水克火','水克火','水克火','火克金','火克金','火克金','火克金','金克木','金克木','金克木','金克木'];

    he5.forEach(function(pair, i) {
      var a = pair[0], b = pair[1];
      if (ganList.indexOf(a) !== -1 && ganList.indexOf(b) !== -1) {
        results.push(a + b + '合化' + he5_wx[i]);
      }
    });

    return results.length > 0 ? results.join('；') : '无';
  }

  // 原局地支
  var yuanZhi = [d.year_zhi, d.month_zhi, d.day_zhi];
  if (!hourUnknownFlag) yuanZhi.push(d.hour_zhi);
  var yuanGan = [d.year_gan, d.month_gan, d.day_gan];
  if (!hourUnknownFlag) yuanGan.push(d.hour_gan);

  var yuanZhiStr = yuanZhi.join(' ');
  var yuanNeiRelations = calcRelations(yuanZhi);
  var yuanGanRelations = calcGanRelations(yuanGan);

  // 各步大运与原局
  var currentYear = new Date().getFullYear();
  var dyRelLines = [];
  d.da_yun.filter(function(dy){ return dy.gz; }).forEach(function(dy) {
    if (dy.start_year > currentYear) return; // 只算已发生大运
    var dyGan = dy.gz[0], dyZhi = dy.gz[1];
    var combinedZhi = yuanZhi.concat([dyZhi]);
    var combinedGan = yuanGan.concat([dyGan]);
    // 只看大运地支与原局各支的两两关系
    var dyZhiRels = calcRelations(combinedZhi);
    var dyGanRels = calcGanRelations(combinedGan);
    dyRelLines.push(
      dy.gz + '大运（' + dy.start_age + '-' + dy.end_age + '岁，' + dy.start_year + '年起）：\n' +
      '  天干关系：' + dyGanRels + '\n' +
      '  地支关系：' + dyZhiRels
    );
  });

  // 近三年流年与原局+当前大运
  var liuNianLines = [];
  var currentDayun = d.da_yun.find(function(dy) {
    return dy.start_year <= currentYear && (dy.start_year + 10) > currentYear;
  });
  var GAN_SEQ = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var ZHI_SEQ = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  for (var yr = currentYear - 2; yr <= currentYear; yr++) {
    var ganIdx = (yr - 4) % 10; if (ganIdx < 0) ganIdx += 10;
    var zhiIdx = (yr - 4) % 12; if (zhiIdx < 0) zhiIdx += 12;
    var lyGan = GAN_SEQ[ganIdx];
    var lyZhi = ZHI_SEQ[zhiIdx];
    var baseZhi = currentDayun ? yuanZhi.concat([currentDayun.gz[1]]) : yuanZhi.slice();
    var baseGan = currentDayun ? yuanGan.concat([currentDayun.gz[0]]) : yuanGan.slice();
    var lyZhiList = baseZhi.concat([lyZhi]);
    var lyGanList = baseGan.concat([lyGan]);
    var lyZhiRels = calcRelations(lyZhiList);
    var lyGanRels = calcGanRelations(lyGanList);
    liuNianLines.push(
      yr + '年 ' + lyGan + lyZhi + '年：\n' +
      '  天干关系：' + lyGanRels + '\n' +
      '  地支关系：' + lyZhiRels
    );
  }

  var preCalcBlock = [
    '【刑冲合害预计算区块】（程序自动计算，AI请勿自行新增或修改）',
    '',
    '原局地支：' + yuanZhiStr,
    '原局天干：' + yuanGan.join(' '),
    '',
    '■ 原局内部天干关系：' + yuanGanRelations,
    '■ 原局内部地支关系：' + yuanNeiRelations,
    '',
    '■ 各步大运与原局的关系：',
    dyRelLines.join('\n'),
    '',
    '■ 近三年流年与原局+当前大运的关系：',
    liuNianLines.join('\n'),
    '',
    '⚠️ AI分析规则：',
    '1. 第五步和第六步，所有刑冲合害只能依据上方已列出的关系，不得自行补充。',
    '2. 区块中未列出的关系一律视为不成立。',
    '3. 丑戌未、寅巳申须三字同现方成三刑；仅两字相遇只称「XX相刑」，不得称「三刑」。',
    '4. 自刑仅限：辰辰、午午、酉酉、亥亥。',
  ].join('\n');
  // =============================================

  var text = [
    '【八字排盘信息】',
    '姓名：' + d.name,
    '性别：' + d.gender,
    '阳历生日：' + d.solar,
    '农历生日：' + d.lunar_date,
    '出生地：' + city,
    hourUnknownFlag ? '时辰：未知（请仅做六字分析，不推算时柱相关内容）' : '真太阳时：' + d.real_time + ' ' + d.shichen + '（校正' + d.offset + '）',
    '',
    '【四柱八字】',
    '年柱：' + d.year_gan + d.year_zhi + '（' + colDesc(d.year_gan, d.year_zhi) + '，天干十神：' + d.year_gan_ss + '，地支十神：' + toArr(d.year_zhi_ss) + '，藏干：' + d.year_hide.join('、') + '）',
    '月柱：' + d.month_gan + d.month_zhi + '（' + colDesc(d.month_gan, d.month_zhi) + '，天干十神：' + d.month_gan_ss + '，地支十神：' + toArr(d.month_zhi_ss) + '，藏干：' + d.month_hide.join('、') + '）',
    '日柱：' + d.day_gan + d.day_zhi + '（' + colDesc(d.day_gan, d.day_zhi) + '，日主，地支十神：' + toArr(d.day_zhi_ss) + '，藏干：' + d.day_hide.join('、') + '）',
    hourUnknownFlag ? '时柱：未知' : '时柱：' + d.hour_gan + d.hour_zhi + '（' + colDesc(d.hour_gan, d.hour_zhi) + '，天干十神：' + d.hour_gan_ss + '，地支十神：' + toArr(d.hour_zhi_ss) + '，藏干：' + d.hour_hide.join('、') + '）',
    '',
    '【五行统计】' + wxStr + (hourUnknownFlag ? '（不含时柱）' : ''),
    '',
    '【大运】起运年份：' + d.yun_start_year + '年',
    dyLines,
    '',
    preCalcBlock,
    '',
    hourUnknownFlag
      ? '时辰未知，请根据以上六字信息进行专业命理分析，不推算时柱相关内容。'
      : '请根据以上八字信息进行专业详细的命理分析，包括：日主旺衰、格局判定、喜用神、大运流年分析，并引用经典典籍论断。'
  ].join('\n');

  await navigator.clipboard.writeText(text);
  var btn = document.getElementById('copy-btn');
  btn.textContent = '✓ 已复制！切换到AI窗口粘贴即可';
  setTimeout(function() { btn.textContent = '复制八字信息给AI分析'; }, 3000);
}
  

  function colDesc(gan, zhi) {
    return (GAN_ATTR[gan] || '') + '/' + (ZHI_ATTR[zhi] || '');
  }

  var wxStr = Object.entries(d.wuxing).map(function(e) { return e[0] + ':' + e[1]; }).join('、');

  var dyLines = d.da_yun.filter(function(dy) { return dy.gz; }).map(function(dy) {
    return '  ' + dy.gz + '（' + dy.start_age + '-' + dy.end_age + '岁，' + dy.start_year + '年起）';

  var hourUnknownFlag = (document.getElementById('hour').value === '');

    '【八字排盘信息】',
    '姓名：' + d.name,
    '性别：' + d.gender,
    '阳历生日：' + d.solar,

    '',
    '【四柱八字】',
    '年柱：' + d.year_gan + d.year_zhi + '（' + colDesc(d.year_gan, d.year_zhi) + '，天干十神：' + d.year_gan_ss + '，地支十神：' + toArr(d.year_zhi_ss) + '，藏干：' + d.year_hide.join('、') + '）',
    '月柱：' + d.month_gan + d.month_zhi + '（' + colDesc(d.month_gan, d.month_zhi) + '，天干十神：' + d.month_gan_ss + '，地支十神：' + toArr(d.month_zhi_ss) + '，藏干：' + d.month_hide.join('、') + '）',
    '日柱：' + d.day_gan + d.day_zhi + '（' + colDesc(d.day_gan, d.day_zhi) + '，日主，地支十神：' + toArr(d.day_zhi_ss) + '，藏干：' + d.day_hide.join('、') + '）',
    hourUnknownFlag ? '时柱：未知' : '时柱：' + d.hour_gan + d.hour_zhi + '（' + colDesc(d.hour_gan, d.hour_zhi) + '，天干十神：' + d.hour_gan_ss + '，地支十神：' + toArr(d.hour_zhi_ss) + '，藏干：' + d.hour_hide.join('、') + '）',
    '',
    '【五行统计】' + wxStr + (hourUnknownFlag ? '（不含时柱）' : ''),
    '',
    '【大运】起运年份：' + d.yun_start_year + '年',
    dyLines,
    '',
    hourUnknownFlag
      ? '时辰未知，请根据以上六字信息进行专业命理分析，不推算时柱相关内容。'
      : '请根据以上八字信息进行专业详细的命理分析，包括：日主旺衰、格局判定、喜用神、大运流年分析，并引用经典典籍论断。'
  ].join('\n');

}
