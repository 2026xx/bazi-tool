<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft JhengHei", sans-serif; background: #f5f0e8; min-height: 100vh; padding: 30px 20px; }
.container { max-width: 600px; margin: 0 auto; }
h1 { text-align: center; font-size: 24px; color: #3d2b1f; margin-bottom: 6px; }
.subtitle { text-align: center; color: #8b6914; font-size: 14px; margin-bottom: 30px; }
.card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.card h2 { font-size: 16px; color: #3d2b1f; margin-bottom: 16px; border-bottom: 1px solid #e8dcc8; padding-bottom: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
label { font-size: 13px; color: #666; }
input, select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #333; background: #fafafa; width: 100%; }
input:focus, select:focus { outline: none; border-color: #8b6914; background: white; }
.hint { font-size: 11px; color: #999; margin-top: 3px; }
.btn { width: 100%; padding: 12px; background: #8b6914; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
.btn:hover { background: #6d5210; }
.result-card { background: #fffdf7; border: 1px solid #e8dcc8; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; }
.result-card h2 { font-size: 16px; color: #3d2b1f; margin-bottom: 16px; }
.bazi-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.bazi-table th { background: #f5ede0; color: #3d2b1f; padding: 8px; font-size: 13px; border: 1px solid #e0d0b8; }
.bazi-table td { text-align: center; padding: 10px; border: 1px solid #e0d0b8; font-size: 22px; color: #3d2b1f; font-weight: bold; }
.bazi-table .small { font-size: 12px; color: #888; font-weight: normal; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.info-item { background: #f9f4ec; border-radius: 6px; padding: 8px 12px; }
.info-label { font-size: 11px; color: #999; }
.info-value { font-size: 13px; color: #333; font-weight: 500; }
.copy-area { background: #f0ebe0; border-radius: 8px; padding: 12px; font-size: 13px; color: #444; line-height: 1.8; margin-bottom: 12px; white-space: pre-wrap; }
.copy-btn { width: 100%; padding: 10px; background: #2d6a4f; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.copy-btn:hover { background: #1b4332; }
.tip { font-size: 12px; color: #999; text-align: center; margin-top: 8px; }
</style>
</head>

function updateCity(city) {
  const lng = CITIES[city] || 120.0;
  const offset = ((lng - 120) * 4).toFixed(0);
  const sign = offset >= 0 ? '+' : '';
  document.getElementById('city-hint').textContent = '经度：' + lng + '°E（偏差北京时间' + sign + offset + '分钟）';
}

async function calculate() {
  const name = document.getElementById('name').value || '用户';
  const gender = document.getElementById('gender').value;
  const year = document.getElementById('year').value;
  const month = document.getElementById('month').value;
  const day = document.getElementById('day').value;
  const hour = document.getElementById('hour').value;
  const minute = document.getElementById('minute').value;
  const city = document.getElementById('city-select').value;

  if (!year || !month || !day || hour === '') {
    alert('请填写完整的出生年月日和时间！');
    return;
  }

  try {
    const url = window.location.origin + '/calc?name=' + encodeURIComponent(name) +
      '&gender=' + encodeURIComponent(gender) +
      '&year=' + year + '&month=' + month + '&day=' + day +
      '&hour=' + hour + '&minute=' + minute +
      '&city=' + encodeURIComponent(city);

    const res = await fetch(url);
    const data = await res.json();

    if (data.error) { alert('计算出错：' + data.error); return; }

    document.getElementById('r-solar').textContent = data.solar;
    document.getElementById('r-lunar').textContent = data.lunar_date;
    document.getElementById('r-offset').textContent = city + '(' + data.longitude + '°E) ' + data.offset;
    document.getElementById('r-realtime').textContent = data.real_time + ' ' + data.shichen;
    document.getElementById('r-year').innerHTML = data.year_gz + '<br><span class="small">年柱</span>';
    document.getElementById('r-month').innerHTML = data.month_gz + '<br><span class="small">月柱</span>';
    document.getElementById('r-day').innerHTML = data.day_gz + '<br><span class="small">日柱</span>';
    document.getElementById('r-hour').innerHTML = data.hour_gz + '<br><span class="small">时柱</span>';

    const copyText = '我想算八字，以下是我的信息：\n\n' +
      '姓名：' + name + '\n' +
      '性别：' + gender + '\n' +
      '阳历生日：' + data.solar + '\n' +
      '农历生日：' + data.lunar_date + '\n' +
      '出生地：' + city + '\n' +
      '真太阳时校正：' + data.offset + '，校正后时间 ' + data.real_time + '，' + data.shichen + '\n\n' +
      '四柱八字：\n' +
      '年柱：' + data.year_gz + '\n' +
      '月柱：' + data.month_gz + '\n' +
      '日柱：' + data.day_gz + '\n' +
      '时柱：' + data.hour_gz + '\n\n' +
      '请帮我进行详细的八字分析。';

    document.getElementById('copy-text').textContent = copyText;
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('copy-btn').textContent = '复制到剪贴板';
  } catch(e) {
    alert('连接失败，请确认排盘服务器已启动！');
  }
}

async function copyText() {
  const text = document.getElementById('copy-text').textContent;
  await navigator.clipboard.writeText(text);
  const btn = document.getElementById('copy-btn');
  btn.textContent = '已复制！';
  setTimeout(() => { btn.textContent = '复制到剪贴板'; }, 2000);
}
